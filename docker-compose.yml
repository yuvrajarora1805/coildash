version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coildash-app
    restart: always
    ports:
      - "3004:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=coildash_root_password
      - DB_NAME=coil_o_matic
      - DB_PORT=3306
      - SENSOR_API_SECRET=secret123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - coildash-network

  db:
    image: mariadb:10.6
    container_name: coildash-db
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=coildash_root_password
      - MARIADB_DATABASE=coil_o_matic
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Automatically initialize the database with our schema
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - coildash-network

networks:
  coildash-network:
    driver: bridge

volumes:
  db_data:
